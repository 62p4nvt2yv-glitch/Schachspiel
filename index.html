

<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pink Chess 💗</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #ffe4f0;

  color: #8b2859;

  text-align: center;

}

main {

  max-width: 520px;

  margin: auto;

  padding: 20px;

}

h1 { color: #d9438c; }

.panel {

  background: white;

  padding: 16px;

  border-radius: 22px;

  box-shadow: 0 8px 25px #e99ac0;

}

#board {

  display: grid;

  grid-template-columns: repeat(8, 1fr);

  aspect-ratio: 1;

  border: 5px solid #d9438c;

  border-radius: 8px;

  overflow: hidden;

}

.square {

  display: grid;

  place-items: center;

  font-size: clamp(26px, 8vw, 48px);

  cursor: pointer;

  padding: 0;

  border: 0;

  border-radius: 0;

}

.light { background: #fff4fa; }

.dark { background: #efa1c8; }

.selected { background: #ffdb76 !important; }

.target { box-shadow: inset 0 0 0 5px #a83278; }

button, select {

  background: #e76ba8;

  color: white;

  border: none;

  border-radius: 12px;

  padding: 12px;

  margin: 5px;

  font-size: 15px;

}

#status { font-weight: bold; }

</style>

</head>

<body>

<main>

<h1>Pink Chess ♛</h1>

<p>Dein pinkes Schachspiel 💗</p>

<div class="panel">

<select id="mode">

<option value="ben">Gegen Ben 🤖</option>

<option value="local">Zu zweit spielen</option>

</select>

<select id="difficulty">

<option value="1">Ben: Einfach</option>

<option value="2">Ben: Mittel</option>

<option value="3">Ben: Schwer</option>

</select>

<button id="reset">Neues Spiel</button>

<div id="board"></div>

<p id="status">Willkommen bei Pink Chess!</p>

<button id="undo">Zug zurück</button>

<p>Wähle eine Figur und dann ihr Zielfeld.</p>

</div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="app.js"></script>

</body>

</html>
